name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Typecheck first: it is the fastest signal.
      - name: Typecheck
        run: npm run typecheck

      # Unit, determinism, architecture, and content validation. No browser
      # needed, because the simulation never touches presentation.
      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

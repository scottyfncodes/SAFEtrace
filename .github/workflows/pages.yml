name: Deploy to GitHub Pages

# Whichever branch was pushed last is what the site shows.
#
# The trigger used to name two branches by hand, so work on any third one was
# invisible on the live site until somebody remembered to edit this file — and
# the branch that happens to be the repository default is itself a `claude/`
# branch, so there was never a stable "production" to point at. A repository has
# exactly one Pages site; last push wins is the honest way to say that, and it
# means the link always shows the branch actually being worked on.
on:
  push:
    branches: ['main', 'claude/**']
  workflow_dispatch:

# Assets are published with relative paths (vite `base: './'`), so the build
# works unchanged under the repository subpath.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
